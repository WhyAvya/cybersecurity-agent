[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-agent"
version = "0.1.0"
description = "Reproducible Semgrep plus local LLM vulnerability analysis workflow"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-requests",
]

[project.scripts]
vuln-agent = "vuln_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "unit: fast tests that do not require external services",
    "integration: tests requiring installed tools or services",
    "e2e: end-to-end tests",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["vuln_agent"]
ignore_missing_imports = true
