services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  app:
    build: .
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      ARTIFACT_ROOT: /artifacts
      REPORT_DIR: /artifacts/reports
      EVALUATION_DIR: /artifacts/evaluation
    volumes:
      - ./artifacts:/artifacts
      - ./examples:/targets:ro
    depends_on:
      - ollama
    command: ["doctor"]

volumes:
  ollama-models:
